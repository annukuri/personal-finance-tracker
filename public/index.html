<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="container">
        <h2>Welcome to Finance Tracker</h2>
        <div class="auth-box">
            <form id="login-form">
                <h3>Login</h3>
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <hr>
            <form id="register-form">
                <h3>Create Account</h3>
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="email" id="register-email" placeholder="Email Address" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="container hidden">
        <header>
            <h2>Financial Dashboard</h2>
            <button id="logout-btn">Logout</button>
        </header>

        <div class="summary-container">
            <div class="card income">
                <h4>Total Income</h4>
                <p id="summary-income">$0.00</p>
            </div>
            <div class="card expense">
                <h4>Total Expenses</h4>
                <p id="summary-expense">$0.00</p>
            </div>
            <div class="card balance">
                <h4>Net Balance</h4>
                <p id="summary-balance">$0.00</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="form-panel">
                <h3>Add New Transaction</h3>
                <form id="transaction-form">
                    <select id="tx-type" required>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                    <select id="tx-category" required>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Fixed">Fixed Expenses</option>
                        <option value="Gifts">Gifts</option>
                        <option value="Savings">Savings</option>
                        <option value="Self-Treat">Self-Treat</option>
                        <option value="Others">Others</option>
                    </select>
                    <input type="number" id="tx-amount" placeholder="Amount ($)" step="0.01" min="0" required>
                    <input type="text" id="tx-desc" placeholder="Description (Optional)">
                    <input type="text" id="tx-tags" placeholder="Tags (comma separated e.g. food, weekend)">
                    <button type="submit">Save Transaction</button>
                </form>
            </div>

            <div class="history-panel">
                <h3>Recent Transactions</h3>
                <ul id="transaction-list">
                    <li class="empty-msg">No transactions recorded yet.</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
