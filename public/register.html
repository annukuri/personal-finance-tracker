<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceApp - Register Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="register-page-bg">
    <div class="register-card-container">
        <div class="register-card">
            <h2>Join FinanceApp Today</h2>
            <p>Start managing, budgeting, and planning your financial metrics instantly.</p>
            
            <form id="register-form">
                <div class="input-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required placeholder="e.g. money_master">
                </div>
                <div class="input-group">
                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email" required placeholder="name@domain.com">
                </div>
                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn btn-primary">Complete Registration</button>
            </form>

            <div class="register-footer">
                <p>Already have an account? <a href="index.html">Sign In here</a></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
